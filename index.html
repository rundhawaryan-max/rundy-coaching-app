<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Elite Coach — @ryan.rundy</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f11;--bg2:#17171a;--bg3:#1f1f24;--bg4:#27272d;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --text:#f0f0f2;--text2:#9191a0;--text3:#5f5f70;
  --accent:#c8f065;--adim:rgba(200,240,101,0.12);
  --red:#ff5c5c;--rdim:rgba(255,92,92,0.15);
  --blue:#5b9cf6;--bdim:rgba(91,156,246,0.12);
  --amber:#f5a524;--ambdim:rgba(245,165,36,0.12);
  --green:#4ade80;--gdim:rgba(74,222,128,0.12);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --sb:228px;--r:10px;--rl:14px
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px;width:100%;outline:none;transition:border .15s;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:72px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:4px}
#app{display:flex;height:100vh;overflow:hidden}
/* Sidebar */
#sidebar{width:var(--sb);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;flex-shrink:0}
.sb-logo{padding:16px 14px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10}
.sb-icon{width:34px;height:34px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.sb-brand{font-weight:700;font-size:14px;color:var(--accent);letter-spacing:-.5px}
.sb-sub{font-size:10px;color:var(--text3)}
nav{flex:1;padding:8px 6px;overflow-y:auto}
.nav-btn{width:100%;display:flex;align-items:center;gap:10;padding:8px 11px;border-radius:9px;margin-bottom:2px;font-size:13px;text-align:left;transition:all .15s;color:var(--text2);cursor:pointer;border:none;background:transparent}
.nav-btn:hover{background:rgba(255,255,255,0.04);color:var(--text)}
.nav-btn.active{background:var(--adim);color:var(--accent);font-weight:600}
.nav-icon{font-size:17px;flex-shrink:0;width:20px;text-align:center}
.nav-label{flex:1}
.nav-badge{border-radius:12px;padding:1px 7px;font-size:10px;font-weight:700}
.sb-status{padding:10px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--green);display:flex;align-items:center;gap:6}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
/* Main */
#main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.page{padding:28px 32px;overflow-y:auto;flex:1;display:none;min-height:0}
.page.active{display:flex;flex-direction:column;min-height:0}
/* Typography */
h1{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
h2{font-size:15px;font-weight:600;margin-bottom:14px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid;font-family:inherit}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-primary{background:var(--accent);color:#0f0f11;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent);opacity:.9}
.btn-ghost{background:transparent;color:var(--text2);border-color:var(--border)}
.btn-ghost:hover{background:rgba(255,255,255,0.04);color:var(--text)}
.btn-danger{background:transparent;color:var(--red);border-color:var(--rdim)}
.btn-danger:hover{background:var(--rdim)}
.btn-filled{background:var(--bg3);color:var(--text);border-color:var(--border)}
.btn-full{width:100%;justify-content:center}
/* Cards */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:18px;transition:border .15s}
.card:hover{border-color:var(--border2)}
.card-grid{display:grid;gap:14px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:1fr 1fr 1fr}
.grid-4{grid-template-columns:1fr 1fr 1fr 1fr}
.grid-auto{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
/* Stat cards */
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.stat-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.stat-value{font-size:26px;font-weight:700;letter-spacing:-.5px}
.stat-sub{font-size:11px;color:var(--text3);margin-top:3px}
/* Badge */
.badge{border-radius:6px;padding:2px 9px;font-size:11px;font-weight:500;white-space:nowrap;display:inline-block}
.badge-green{background:var(--gdim);color:var(--green)}
.badge-blue{background:var(--bdim);color:var(--blue)}
.badge-amber{background:var(--ambdim);color:var(--amber)}
.badge-red{background:var(--rdim);color:var(--red)}
.badge-gray{background:rgba(255,255,255,0.06);color:var(--text2)}
.badge-accent{background:var(--adim);color:var(--accent)}
.badge-active{background:var(--gdim);color:var(--green)}
.badge-paused{background:var(--ambdim);color:var(--amber)}
.badge-inactive{background:rgba(255,255,255,0.06);color:var(--text3)}
.badge-paid{background:var(--gdim);color:var(--green)}
.badge-pending{background:var(--ambdim);color:var(--amber)}
.badge-overdue{background:var(--rdim);color:var(--red)}
/* Avatar */
.avatar{border-radius:50%;background:var(--adim);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);flex-shrink:0;letter-spacing:-.5px}
/* Form */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:500px;max-height:90vh;overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.modal-wide{max-width:700px}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:1}
.modal-header span{font-weight:600;font-size:15px}
.modal-close{color:var(--text3);font-size:22px;cursor:pointer;line-height:1;background:none;border:none}
.modal-body{padding:20px 22px}
/* Table */
.data-table{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.table-head{display:grid;padding:10px 18px;border-bottom:1px solid var(--border);font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.table-row{display:grid;padding:12px 18px;border-bottom:1px solid var(--border);align-items:center;font-size:13px;transition:background .1s;cursor:default}
.table-row:hover{background:var(--bg3)}
.table-row:last-child{border-bottom:none}
/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{height:4px}
.tab-btn{flex-shrink:0}
.tab-btn{padding:8px 16px;border-radius:8px 8px 0 0;font-size:13px;font-weight:400;color:var(--text3);border-bottom:2px solid transparent;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;transition:all .15s;font-family:inherit;text-transform:capitalize}
.tab-btn.active{background:var(--bg3);color:var(--accent);font-weight:600;border-bottom:2px solid var(--accent)}
/* Breadcrumb */
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:22px;font-size:13px}
.breadcrumb-link{color:var(--text3);cursor:pointer;transition:color .15s}
.breadcrumb-link:hover{color:var(--text)}
.breadcrumb-sep{color:var(--border);font-size:14px}
/* Empty state */
.empty{text-align:center;padding:56px 0;color:var(--text3)}
.empty-icon{font-size:32px;margin-bottom:12px}
.empty-msg{font-size:13px}
/* Checkin item */
.ci-item{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:15px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.ci-date{font-size:11px;color:var(--text3);min-width:92px;padding-top:2px}
/* Macro card */
.macro-card{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:18px;margin-bottom:10px}
.macro-val{font-size:24px;font-weight:700;color:var(--accent);letter-spacing:-.5px;margin-bottom:12px}
.macro-bars{display:flex;gap:10px}
.macro-bar{flex:1;background:var(--bg3);border-radius:9px;padding:9px;text-align:center}
.macro-bar-val{font-size:16px;font-weight:700;letter-spacing:-.3px}
.macro-bar-label{font-size:10px;color:var(--text3);margin-top:2px}
/* Message layout */
#msg-layout{display:flex;flex:1;overflow:hidden;min-height:0}
#msg-list{width:240px;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;min-height:0}
#msg-list-header{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;flex-shrink:0}
#msg-clients{overflow-y:auto;flex:1}
.msg-client-btn{width:100%;padding:11px 14px;display:flex;align-items:center;gap:10px;background:transparent;border-bottom:1px solid var(--border);text-align:left;transition:background .1s;cursor:pointer;border-left:none;border-right:none;border-top:none;font-family:inherit}
.msg-client-btn:hover{background:rgba(255,255,255,0.03)}
.msg-client-btn.active{background:var(--adim)}
.msg-thread-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
#msg-thread-header{padding:13px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
#msg-thread{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-height:0}
#msg-input-row{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:10px;flex-shrink:0}
.bubble{max-width:70%;border-radius:14px;padding:9px 13px;font-size:13px;line-height:1.5}
.bubble-coach{background:var(--accent);color:#0f0f11;border-radius:14px 14px 3px 14px;align-self:flex-end}
.bubble-client{background:var(--bg3);color:var(--text);border-radius:14px 14px 14px 3px;align-self:flex-start}
.bubble-time{font-size:10px;opacity:.55;margin-top:4px}
/* Progress chart placeholder */
.chart-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px}
.chart-title{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;font-weight:600}
canvas{display:block}
/* Loading */
#loading{display:flex;height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:var(--text3)}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Workout grid */
.workout-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px}
.ex-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--border)}
.ex-name{font-size:12px;font-weight:500}
.ex-meta{font-size:11px;color:var(--text3);margin-top:1px}
/* Meal plan */
.meal-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.meal-food-row{display:grid;grid-template-columns:1fr 55px 64px 44px 44px 44px;gap:8px;padding:5px 0;border-top:1px solid var(--border);font-size:12px;align-items:center}
/* Dashboard roster button */
.roster-btn{width:100%;display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);text-align:left;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;font-family:inherit;transition:opacity .15s}
.roster-btn:hover{opacity:.75}
select option{background:var(--bg3)}
</style>
</head>
<body>

<div id="loading">
  <div style="width:40px;height:40px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:4px">⚡</div>
  <div class="spinner"></div>
  <span style="font-size:13px">Loading Elite Coach…</span>
</div>

<div id="app" style="display:none">
  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sb-logo">
      <div class="sb-icon">⚡</div>
      <div>
        <div class="sb-brand">Elite Coach</div>
        <div class="sb-sub">@ryan.rundy</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sb-status"><div class="dot"></div>Live · Supabase connected</div>
  </div>
  <!-- Main -->
  <div id="main">
    <div id="page-dashboard" class="page active"></div>
    <div id="page-clients" class="page"></div>
    <div id="page-client-detail" class="page"></div>
    <div id="page-programs" class="page"></div>
    <div id="page-cardio" class="page"></div>
    <div id="page-checkins" class="page"></div>
    <div id="page-macros" class="page"></div>
    <div id="page-meals" class="page"></div>
    <div id="page-messages" class="page" style="padding:0;overflow:hidden"></div>
    <div id="page-payments" class="page"></div>
    <div id="page-progress" class="page"></div>
  </div>
</div>

<!-- Modal container -->
<div id="modal-root"></div>

<script>
// ── Supabase ──────────────────────────────────────────────────────
const SB_URL='https://emrtizvqzjkfrpgyrljn.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtcnRpenZxemprZnJwZ3lybGpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3NTA0NjAsImV4cCI6MjA5NzMyNjQ2MH0.n11s1EOwPRBP934TY4sZrMWuh-A7aUGLh3VZ0yZOtww';

async function sbFetch(path, opts={}) {
  const url = SB_URL + '/rest/v1/' + path;
  const headers = {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Content-Type': 'application/json',
    'Prefer': opts.prefer || 'return=representation',
    ...(opts.headers||{})
  };
  const r = await fetch(url, { method: opts.method||'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (!r.ok) { const t = await r.text(); console.error('SB error', r.status, t); return null; }
  if (r.status === 204) return true;
  return r.json();
}

const sb = {
  async select(table, params='') { return await sbFetch(table + '?' + params + '&apikey=' + SB_KEY) || []; },
  async insert(table, body) { return await sbFetch(table, { method:'POST', body, prefer:'return=representation' }); },
  async update(table, body, match) { return await sbFetch(table + '?' + match, { method:'PATCH', body, prefer:'return=representation' }); },
  async delete(table, match) { return await sbFetch(table + '?' + match, { method:'DELETE', prefer:'return=minimal' }); }
};

// ── State ─────────────────────────────────────────────────────────
let STATE = { clients:[], payments:[], messages:[], checkIns:[], dailyLogs:[], currentView:'dashboard', selectedClient:null, charts:{} };

// ── Helpers ───────────────────────────────────────────────────────
const initials = n => (n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const fmtCAD = n => '$' + Number(n).toFixed(2);
// local-timezone date (UTC would roll over to tomorrow during Ryan's evening,
// and the client app writes local dates — these must agree)
const localDate = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().split('T')[0]; };
const today = () => localDate(new Date());
const daysAgoDate = n => { const d = new Date(); d.setDate(d.getDate()-n); return localDate(d); };
function getWeekDates() {
  const now = new Date();
  const dow = now.getDay();
  const mondayOffset = dow === 0 ? -6 : 1 - dow;
  const monday = new Date(now);
  monday.setDate(now.getDate() + mondayOffset);
  const dates = [];
  for (let i=0;i<7;i++) { const d = new Date(monday); d.setDate(monday.getDate()+i); dates.push(d.toISOString().split('T')[0]); }
  return dates;
}
const fmt12 = ts => new Date(ts).toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit'});
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function avatar(name, size=36) {
  const s = Math.round(size*0.35);
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${s}px">${esc(initials(name))}</div>`;
}

function badge(color, text) {
  return `<span class="badge badge-${esc(color)}">${esc(text)}</span>`;
}

function btn(label, cls, attrs='', icon='') {
  return `<button class="btn ${cls}" ${attrs}>${icon?`<span>${icon}</span>`:''}${esc(label)}</button>`;
}

function statCard(label, value, icon, color, sub='') {
  return `<div class="stat-card">
    <div class="stat-label"><span>${icon}</span>${esc(label)}</div>
    <div class="stat-value" style="color:${color}">${esc(value)}</div>
    ${sub?`<div class="stat-sub">${esc(sub)}</div>`:''}
  </div>`;
}

function empty(icon, msg) {
  return `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-msg">${esc(msg)}</div></div>`;
}

function field(label, input) {
  return `<div class="field"><label>${esc(label)}</label>${input}</div>`;
}

// ── Modal ─────────────────────────────────────────────────────────
function showModal(title, bodyHtml, wide=false, onShow=null) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal${wide?' modal-wide':''}">
        <div class="modal-header">
          <span>${esc(title)}</span>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
      </div>
    </div>`;
  document.getElementById('modal-overlay').addEventListener('click', e => { if(e.target.id==='modal-overlay') closeModal(); });
  if(onShow) setTimeout(onShow, 10);
}
function closeModal() { document.getElementById('modal-root').innerHTML=''; }

// ── Navigation ────────────────────────────────────────────────────
const NAV = [
  {id:'dashboard', icon:'🏠', label:'Dashboard'},
  {id:'clients', icon:'👥', label:'Clients'},
  {id:'programs', icon:'🏋️', label:'Programs'},
  {id:'cardio', icon:'🏃', label:'Cardio'},
  {id:'checkins', icon:'📋', label:'Check-ins'},
  {id:'macros', icon:'🥧', label:'Macros'},
  {id:'meals', icon:'🥗', label:'Meal Plans'},
  {id:'messages', icon:'💬', label:'Messages'},
  {id:'payments', icon:'💳', label:'Payments'},
  {id:'progress', icon:'📈', label:'Progress'},
];

function renderNav() {
  const unread = STATE.messages.filter(m=>!m.read&&m.sender==='client').length;
  document.getElementById('nav').innerHTML = NAV.map(n => {
    const isActive = STATE.currentView===n.id || (STATE.currentView==='client-detail'&&n.id==='clients');
    let badge2 = '';
    if(n.id==='clients') badge2 = `<span class="nav-badge" style="background:var(--adim);color:var(--accent)">${STATE.clients.length}</span>`;
    if(n.id==='messages'&&unread>0) badge2 = `<span class="nav-badge" style="background:var(--rdim);color:var(--red)">${unread}</span>`;
    return `<button class="nav-btn${isActive?' active':''}" onclick="navigate('${n.id}')">
      <span class="nav-icon">${n.icon}</span>
      <span class="nav-label">${n.label}</span>
      ${badge2}
    </button>`;
  }).join('');
}

function navigate(view) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const target = document.getElementById('page-'+view);
  if(target) { target.classList.add('active'); STATE.currentView=view; renderNav(); renderPage(view); }
}

function navToClientDetail(client) {
  STATE.selectedClient = client;
  STATE.currentView = 'client-detail';
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-client-detail').classList.add('active');
  renderNav();
  renderClientDetail(client);
}

// ── Pages ─────────────────────────────────────────────────────────
function renderPage(view) {
  switch(view) {
    case 'dashboard': renderDashboard(); break;
    case 'clients': renderClients(); break;
    case 'programs': renderPrograms(); break;
    case 'cardio': renderCardio(); break;
    case 'checkins': renderCheckIns(); break;
    case 'macros': renderMacros(); break;
    case 'meals': renderMeals(); break;
    case 'messages': renderMessages(); break;
    case 'payments': renderPayments(); break;

// ── Dashboard ─────────────────────────────────────────────────────
// ── Daily check-in roll-up (feeds the dashboard card) ─────────────
// Daily weight is noisy; the 7-day average is the signal. Compare the last
// 7 days against the 7 before it — that trend is what drives a macro change.
function dailyRollup() {
  const todayStr = today(), d7 = daysAgoDate(6), d8 = daysAgoDate(7), d14 = daysAgoDate(13);
  const byClient = {};
  (STATE.dailyLogs||[]).forEach(d => { (byClient[d.client_id] = byClient[d.client_id]||[]).push(d); });
  const mean = a => a.length ? a.reduce((s,n)=>s+n,0)/a.length : null;
  const wIn = (logs,from,to) => mean(logs.filter(l=>l.weight_kg!=null && l.date>=from && l.date<=to).map(l=>Number(l.weight_kg)));

  return STATE.clients.filter(c=>c.status==='active').map(c => {
    const logs = byClient[c.id] || [];
    const todayLog = logs.find(l=>l.date===todayStr) || null;
    const avg = wIn(logs, d7, todayStr), prev = wIn(logs, d14, d8);
    return {
      client: c, log: todayLog, avg,
      delta: (avg!=null && prev!=null) ? avg-prev : null,
      logged7: logs.filter(l=>l.date>=d7 && l.date<=todayStr).length
    };
  }).sort((a,b) => (a.log?1:0)-(b.log?1:0) || a.client.name.localeCompare(b.client.name));
}

function renderDailyCheckinCard() {
  const rows = dailyRollup();
  if (!rows.length) return '';
  const done = rows.filter(r=>r.log).length;
  const line = r => {
    const d = r.log;
    const trend = r.delta==null ? '' :
      r.delta <= -0.2 ? `<span class="badge badge-green">▼ ${Math.abs(r.delta).toFixed(1)} lbs/wk</span>`
    : r.delta >=  0.2 ? `<span class="badge badge-amber">▲ ${r.delta.toFixed(1)} lbs/wk</span>`
    : `<span class="badge badge-gray">flat</span>`;
    return `<button class="daily-btn" style="width:100%;display:flex;align-items:center;gap:10px;padding:9px 0;background:transparent;border:none;border-bottom:1px solid var(--border);cursor:pointer;text-align:left">
      ${avatar(r.client.name,32)}
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;color:var(--text)">${esc(r.client.name)}</div>
        <div style="font-size:11px;color:var(--text3)">
          ${d ? `${d.weight_kg!=null?esc(d.weight_kg)+' lbs today':'no weight'} · ${r.logged7}/7 days logged`
              : `Not logged today · ${r.logged7}/7 days this week`}
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
        ${r.avg!=null?badge('blue','7d avg '+r.avg.toFixed(1)):''}
        ${trend}
        ${d&&d.refreshed===false?badge('amber','Not rested'):''}
        ${d&&d.desire_to_train!=null&&d.desire_to_train<=2?badge('red','Drive '+d.desire_to_train+'/5'):''}
        ${d&&d.digestive_issue?badge('amber','Digestive'):''}
        ${d&&d.untracked_food?badge('gray','Untracked'):''}
        ${d?'':badge('gray','—')}
      </div>
    </button>`;
  };
  return `<div class="card" style="cursor:default;margin-bottom:26px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;font-weight:600">Daily check-ins · today</div>
      <span class="badge badge-${done===rows.length?'green':(done?'amber':'gray')}">${done}/${rows.length} logged</span>
    </div>
    ${rows.map(line).join('')}
  </div>`;
}

// Progress photos uploaded from the client portal. Files sit in the private 'progress-photos' bucket;
// progress_photos.url holds the storage path, shown here through 1-hour signed URLs.
async function renderPhotosEmbedded(client) {
  const el = document.getElementById('cd-tab-content');
  el.innerHTML = `<div style="text-align:center;padding:48px"><div class="spinner" style="margin:0 auto"></div></div>`;
  const rows = await sb.select('progress_photos','client_id=eq.'+client.id+'&order=taken_at.desc,created_at.desc') || [];
  if (CD.tab!=='photos') return;
  if (!rows.length) { el.innerHTML = empty('📸','No progress photos yet. Clients upload them from the Photos tab in their portal.'); return; }
  const urls = {};
  try {
    const r = await fetch(SB_URL+'/storage/v1/object/sign/progress-photos', { method:'POST', headers:{ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ expiresIn:3600, paths: rows.map(p=>p.url) }) });
    if (r.ok) (await r.json()).forEach(x => { if (x.signedURL) urls[x.path] = SB_URL+'/storage/v1'+x.signedURL; });
  } catch(e) { console.error('Photo sign error', e); }
  if (CD.tab!=='photos') return;
  const dates = [...new Set(rows.map(p=>p.taken_at))];
  const thumb = p => `<a href="${esc(urls[p.url]||'#')}" target="_blank" rel="noopener" style="position:relative;display:block;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--bg3)">
      <img src="${esc(urls[p.url]||'')}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"/>
      <span style="position:absolute;left:0;right:0;bottom:0;padding:5px;background:rgba(0,0,0,.55);font-size:11px;font-weight:600;color:#fff;text-align:center">${esc(p.label||'')}</span></a>`;
  // Then vs now: earliest and latest date, every pose present on both
  let compare = '';
  if (dates.length>=2) {
    const first = dates[dates.length-1], latest = dates[0];
    const pairs = ['Front','Side','Back'].map(pose => [rows.find(p=>p.taken_at===first&&p.label===pose), rows.find(p=>p.taken_at===latest&&p.label===pose)]).filter(([a,b])=>a&&b);
    if (pairs.length) compare = `
      <div class="card" style="cursor:default;margin-bottom:18px">
        <div class="card-title">Then vs now — ${esc(first)} → ${esc(latest)}</div>
        <div style="display:grid;grid-template-columns:repeat(${pairs.length*2},1fr);gap:10px;max-width:${pairs.length*2*170}px">${pairs.map(([a,b])=>thumb(a)+thumb(b)).join('')}</div>
      </div>`;
  }
  el.innerHTML = compare + dates.map(d => `
    <h3 style="margin:0 0 10px;font-size:14px">${esc(d)} <span style="color:var(--text3);font-weight:400;font-size:12px">· ${rows.filter(p=>p.taken_at===d).length} photo(s)</span></h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:22px;max-width:640px">${rows.filter(p=>p.taken_at===d).map(thumb).join('')}</div>`).join('');
}

function drawCoachStepsChart(data, goal) {
  const canvas = document.getElementById('coach-steps-chart');
  if(!canvas) return;
  const dpr = window.devicePixelRatio||1;
  const W = canvas.parentElement.clientWidth - 40;
  const H = 180;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const pad = {t:10,r:10,b:26,l:10};
  const cW = W-pad.l-pad.r, cH = H-pad.t-pad.b;
  const max = Math.max(...data.map(d=>d.steps), goal||1000, 1000);
  const barW = cW/data.length * 0.6;
  const gap = cW/data.length;

  // Goal reference line
  if (goal) {
    const goalY = pad.t + cH - (goal/max)*cH;
    ctx.setLineDash([4,4]);
    ctx.strokeStyle = 'rgba(245,165,36,0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(pad.l, goalY);
    ctx.lineTo(pad.l+cW, goalY);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  data.forEach((d,i)=>{
    const h = (d.steps/max)*cH;
    const x = pad.l + i*gap + (gap-barW)/2;
    const y = pad.t + cH - h;
    const hitGoal = goal && d.steps >= goal;
    ctx.fillStyle = hitGoal ? '#4ade80' : '#c8f065';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x,y,barW,h,4) : ctx.rect(x,y,barW,h);
    ctx.fill();
    ctx.fillStyle = '#5f5f70';
    ctx.font = '10px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    const lbl = new Date(d.date+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'}).slice(0,3);
    ctx.fillText(lbl, x+barW/2, H-8);
  });
}

      ${field('Amount (g)','<input id="fd-g" type="number"/>')}
      ${field('Calories','<input id="fd-cal" type="number"/>')}
      ${field('Protein (g)','<input id="fd-p" type="number"/>')}
      ${field('Carbs (g)','<input id="fd-c" type="number"/>')}
      ${field('Fat (g)','<input id="fd-f" type="number"/>')}
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:8px">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="addFood('${esc(mid)}')">Add food</button>
    </div>`);
}
async function addFood(mid) {
  const body={food_name:document.getElementById('fd-name').value,amount_g:document.getElementById('fd-g').value,calories:document.getElementById('fd-cal').value,protein_g:document.getElementById('fd-p').value,carbs_g:document.getElementById('fd-c').value,fat_g:document.getElementById('fd-f').value,meal_id:mid,order_index:(ML.foods[mid]||[]).length};
  const data=await sb.insert('meal_foods',body);
  if(data&&data[0]){if(!ML.foods[mid])ML.foods[mid]=[];ML.foods[mid].push(data[0]);closeModal();renderMealDetail();}
}

// ── Messages ──────────────────────────────────────────────────────
let MSG = { all:[], selClient:null };

async function renderMessages() {
  const el=document.getElementById('page-messages');
  MSG.all=await sb.select('messages','order=created_at.desc')||[];
  if(!MSG.selClient || !STATE.clients.find(c=>c.id===MSG.selClient.id)) {
    MSG.selClient=STATE.clients[0]||null;
  }
  el.innerHTML=`
    <div id="msg-layout">
      <div id="msg-list">
        <div id="msg-list-header">Messages</div>
        <div id="msg-clients">${STATE.clients.map(c=>{
          const unread=MSG.all.filter(m=>m.client_id===c.id&&!m.read&&m.sender==='client').length;
          const last=MSG.all.filter(m=>m.client_id===c.id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
          return `<button class="msg-client-btn${MSG.selClient?.id===c.id?' active':''}" data-cid="${esc(c.id)}">
            ${avatar(c.name,36)}
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:${MSG.selClient?.id===c.id?600:400};color:${MSG.selClient?.id===c.id?'var(--accent)':'var(--text)'}">${esc(c.name)}</div>
              <div style="font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px">${esc(last?.body||'No messages')}</div>
            </div>
            ${unread>0?`<span style="background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700;flex-shrink:0">${unread}</span>`:''}
          </button>`;}).join('')}
        </div>
      </div>
      <div class="msg-thread-wrap" id="msg-thread-wrap">
        ${renderThreadHTML()}
      </div>
    </div>`;
  document.querySelectorAll('.msg-client-btn').forEach(b=>{
    const cid=b.dataset.cid;
    b.onclick=async ()=>{
      MSG.selClient=STATE.clients.find(c=>c.id===cid)||null;
      await markRead(cid);
      renderMessages();
    };
  });
  const send=()=>{
    const inp=document.getElementById('msg-input');
    if(inp&&inp.value.trim()) sendMsg(inp.value.trim());
  };
  document.getElementById('msg-send')?.addEventListener('click',send);
  document.getElementById('msg-input')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
  document.getElementById('msg-thread')?.scrollTo(0,99999);
}

function renderThreadHTML() {
  if(!MSG.selClient)return`<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px">Select a client to view messages</div>`;
  const c=MSG.selClient;
  const thread=[...MSG.all.filter(m=>m.client_id===c.id)].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  return `
    <div id="msg-thread-header">${avatar(c.name,34)}<span style="font-weight:600;font-size:14px">${esc(c.name)}</span><span style="font-size:11px;color:var(--text3);margin-left:4px">${esc(c.goal||'')}</span></div>
    <div id="msg-thread">
      ${thread.length===0?`<div style="text-align:center;color:var(--text3);font-size:13px;margin-top:48px">No messages yet. Send the first one.</div>`:''}
      ${thread.map(m=>`
        <div style="display:flex;justify-content:${m.sender==='coach'?'flex-end':'flex-start'}">
          <div class="bubble bubble-${m.sender}">
            <div>${esc(m.body)}</div>
            <div class="bubble-time" style="text-align:${m.sender==='coach'?'right':'left'}">${fmt12(m.created_at)}</div>
          </div>
        </div>`).join('')}
    </div>
    <div id="msg-input-row">
      <input id="msg-input" placeholder="Message ${esc(c.name)}… (Enter to send)" style="flex:1"/>
      <button id="msg-send" class="btn btn-primary">Send ↗</button>
    </div>`;
}

async function markRead(cid) {
  await sb.update('messages',{read:true},'client_id=eq.'+cid+'&sender=eq.client');
  MSG.all=MSG.all.map(m=>m.client_id===cid&&m.sender==='client'?{...m,read:true}:m);
  renderNav();
}

async function sendMsg(body) {
  if(!MSG.selClient)return;
  const data=await sb.insert('messages',{client_id:MSG.selClient.id,sender:'coach',body,read:true,created_at:new Date().toISOString()});
  if(data&&data[0]){MSG.all.push(data[0]);document.getElementById('msg-input').value='';document.getElementById('msg-thread-wrap').innerHTML=renderThreadHTML();document.getElementById('msg-thread')?.scrollTo(0,99999);document.getElementById('msg-send')?.addEventListener('click',()=>{const inp=document.getElementById('msg-input');if(inp&&inp.value.trim())sendMsg(inp.value.trim());});document.getElementById('msg-input')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const inp=document.getElementById('msg-input');if(inp&&inp.value.trim())sendMsg(inp.value.trim());}});}
}

// ── Payments ──────────────────────────────────────────────────────
async function renderPayments() {
  const el=document.getElementById('page-payments');
  el.innerHTML=`<div style="text-align:center;padding:48px"><div class="spinner" style="margin:0 auto"></div></div>`;
  const all=await sb.select('payments','order=due_date.desc')||[];
  const gc=id=>STATE.clients.find(c=>c.id===id);
  const paid=all.filter(p=>p.status==='paid').reduce((s,p)=>s+Number(p.amount_cad),0);
  const out=all.filter(p=>p.status!=='paid').reduce((s,p)=>s+Number(p.amount_cad),0);
  const ov=all.filter(p=>p.status==='overdue').length;
  el.innerHTML=`
    <div class="page-header">
      <h1>Payments</h1>
      <button class="btn btn-primary" onclick="showAddPayment()">+ New invoice</button>
    </div>
    <div class="card-grid grid-3" style="margin-bottom:26px">
      ${statCard('Total paid',fmtCAD(paid),'✅','var(--green)','CAD collected')}
      ${statCard('Outstanding',fmtCAD(out),'⏰','var(--amber)','pending + overdue')}
      ${statCard('Overdue invoices',ov,'⚠️','var(--red)','')}
    </div>
    ${all.length===0?empty('💳','No payments yet.'):`
    <div class="data-table">
      <div class="table-head" style="grid-template-columns:1.2fr 1.5fr 110px 100px 160px">
        <span>Client</span><span>Description</span><span>Amount</span><span>Due</span><span>Status</span>
      </div>
      ${all.map((p,i)=>{
        const cl=gc(p.client_id);
        return `<div class="table-row" style="grid-template-columns:1.2fr 1.5fr 110px 100px 160px">
          <div style="display:flex;align-items:center;gap:8px">${avatar(cl?.name||'?',28)}<span style="font-weight:500">${esc(cl?.name||'—')}</span></div>
          <span style="color:var(--text2)">${esc(p.description||'')}</span>
          <span style="font-weight:600;color:var(--accent)">${fmtCAD(p.amount_cad)}</span>
          <span style="color:var(--text3);font-size:12px">${esc(p.due_date||'')}</span>
          <div style="display:flex;gap:8px;align-items:center">
            ${badge(p.status,p.status)}
            ${p.status!=='paid'?`<button onclick="markPaymentPaid('${esc(p.id)}',${i})" style="font-size:11px;color:var(--green);cursor:pointer;font-weight:500;font-family:inherit">Mark paid ✓</button>`:''}
          </div>
        </div>`;}).join('')}
    </div>`}`;

  window._pmts = all;
}

async function markPaymentPaid(id) {
  await sb.update('payments',{status:'paid',paid_date:today()},'id=eq.'+id);
  renderPayments();
}

function showAddPayment() {
  showModal('New invoice', `
    ${field('Client',`<select id="pay-client"><option value="">— select —</option>${STATE.clients.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select>`)}
    <div class="form-row">
      ${field('Amount (CAD)','<input id="pay-amt" type="number" step=".01" value="250"/>')}
      ${field('Status','<select id="pay-status"><option value="pending">Pending</option><option value="paid">Paid</option><option value="overdue">Overdue</option></select>')}
    </div>
    ${field('Description','<input id="pay-desc" value="Monthly coaching"/>')}
    ${field('Due date','<input id="pay-due" type="date" value="'+today()+'"/>')}
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:8px">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="addPayment()">Create invoice</button>
    </div>`);
}
async function addPayment() {
  const body={client_id:document.getElementById('pay-client').value,amount_cad:document.getElementById('pay-amt').value,status:document.getElementById('pay-status').value,description:document.getElementById('pay-desc').value,due_date:document.getElementById('pay-due').value};
  const data=await sb.insert('payments',body);
  if(data&&data[0]){closeModal();renderPayments();}
}

// ── Progress ──────────────────────────────────────────────────────
async function renderProgress(clientId) {
  const el=document.getElementById('page-progress');
  if(!clientId&&STATE.clients.length>0)clientId=STATE.clients[0].id;
  el.innerHTML=`
    <div class="page-header">
      <h1>Progress</h1>
      <select onchange="renderProgress(this.value)" style="width:220px">
        ${STATE.clients.map(c=>`<option value="${esc(c.id)}"${c.id===clientId?' selected':''}>${esc(c.name)}</option>`).join('')}
      </select>
    </div>
    <div style="text-align:center;padding:48px"><div class="spinner" style="margin:0 auto"></div></div>`;
  if(!clientId)return;
  const cis=await sb.select('check_ins','client_id=eq.'+clientId+'&order=date.asc')||[];
  if(cis.length<2){el.querySelector('div:last-child').outerHTML=empty('📈','Need at least 2 check-ins to show charts. Log them from a client profile.');return;}
  const first=cis[0],last=cis[cis.length-1];
  const delta=(a,b)=>{if(!a||!b)return'—';const d=Number(a)-Number(b);return(d>0?'+':'')+d.toFixed(1);};
  el.innerHTML=`
    <div class="page-header">
      <h1>Progress</h1>
      <select onchange="renderProgress(this.value)" style="width:220px">
        ${STATE.clients.map(c=>`<option value="${esc(c.id)}"${c.id===clientId?' selected':''}>${esc(c.name)}</option>`).join('')}
      </select>
    </div>
    <div class="card-grid grid-4" style="margin-bottom:24px">
      ${statCard('Start weight',(first?.weight_kg||'—')+' lbs','⚖','var(--text2)')}
      ${statCard('Current weight',(last?.weight_kg||'—')+' lbs','⚖','var(--blue)')}
      ${statCard('Change',delta(last?.weight_kg,first?.weight_kg)+' lbs','📈',Number(delta(last?.weight_kg,first?.weight_kg))<0?'var(--green)':'var(--amber)')}
      ${statCard('Check-ins',cis.length,'📋','var(--accent)')}
    </div>
    <div class="card-grid grid-2">
      <div class="chart-box"><div class="chart-title">Weight (lbs)</div><canvas id="chart-weight" height="200"></canvas></div>
      <div class="chart-box"><div class="chart-title">Body fat %</div><canvas id="chart-bf" height="200"></canvas></div>
    </div>`;

  // Draw charts with Canvas 2D API — no library needed
  const labels=cis.map(c=>c.date.slice(5));
  drawLineChart(document.getElementById('chart-weight'),labels,cis.map(c=>c.weight_kg),'#5b9cf6');
  drawLineChart(document.getElementById('chart-bf'),labels,cis.map(c=>c.body_fat),'#c8f065');
}

function drawLineChart(canvas, labels, data, color) {
  const validData=data.map(Number).filter(v=>!isNaN(v));
  if(!canvas||!validData.length)return;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.parentElement.clientWidth-40;
  const H=200;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const pad={t:10,r:20,b:32,l:44};
  const cW=W-pad.l-pad.r, cH=H-pad.t-pad.b;
  const vals=data.map(Number);
  const min=Math.min(...validData),max=Math.max(...validData);
  const rng=max-min||1;
  const xStep=cW/(labels.length-1||1);
  const yPx=v=>pad.t+cH-(((Number(v)||min)-min)/rng)*cH;
  const xPx=i=>pad.l+i*xStep;

  // Grid
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=pad.t+cH*(i/4);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cW,y);ctx.stroke();}

  // Axes labels
  ctx.fillStyle='#5f5f70';ctx.font='10px -apple-system,sans-serif';ctx.textAlign='right';
  for(let i=0;i<=4;i++){const v=max-rng*(i/4);ctx.fillText(v.toFixed(1),pad.l-6,pad.t+cH*(i/4)+3);}
  ctx.textAlign='center';
  const step=Math.ceil(labels.length/6);
  labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)ctx.fillText(l,xPx(i),H-pad.b+14);});

  // Fill
  const gradient=ctx.createLinearGradient(0,pad.t,0,pad.t+cH);
  gradient.addColorStop(0,color+'30');gradient.addColorStop(1,color+'05');
  ctx.beginPath();
  vals.forEach((v,i)=>{const x=xPx(i),y=yPx(v);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.lineTo(xPx(vals.length-1),pad.t+cH);ctx.lineTo(xPx(0),pad.t+cH);ctx.closePath();
  ctx.fillStyle=gradient;ctx.fill();

  // Line
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineJoin='round';
  vals.forEach((v,i)=>{const x=xPx(i),y=yPx(v);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.stroke();

  // Dots
  vals.forEach((v,i)=>{
    ctx.beginPath();ctx.arc(xPx(i),yPx(v),4,0,Math.PI*2);
    ctx.fillStyle='#0f0f11';ctx.fill();
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
  });
}

// ── Init ──────────────────────────────────────────────────────────
async function init() {
  const [clients, payments, messages, checkIns, dailyLogs] = await Promise.all([
    sb.select('clients','order=created_at.desc'),
    sb.select('payments','order=due_date.desc'),
    sb.select('messages','order=created_at.desc'),
    sb.select('check_ins','order=date.desc&limit=30'),
    sb.select('daily_logs','order=date.desc&limit=500'),
  ]);
  STATE.clients = clients||[];
  STATE.payments = payments||[];
  STATE.messages = messages||[];
  STATE.checkIns = checkIns||[];
  STATE.dailyLogs = dailyLogs||[];

  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  renderNav();
  renderDashboard();
}

init().catch(e=>{ console.error(e); alert('Failed to connect to Supabase. Check your internet connection.'); });
